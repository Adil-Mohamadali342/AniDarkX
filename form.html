<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="./form.css">

</head>

<body>
<div class="error d-flex flex-row justify-content-center"><h1>AniDarkX</h1></div>
<div class="container">
<form action="./details.html">

<div>
<input type="text" name="name" placeholder="Enter your name" >
</div>

<div>
    <input type="email" name="email" placeholder="Enter your email" >
</div>

<div>
<input class="password" type="password" name="password" placeholder="Enter your password" required>
</div>

<div>
<input class="confirm" type="password" name="confirm-password" placeholder="Confirm password" required>
</div>

<div>
<button type="submit">Submit</button>
</div>

</form>
</div>
<script src="form.js"></script>
</body>
</html>
